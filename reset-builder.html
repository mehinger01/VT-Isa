<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Builder | Isa OS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="tools.css"><script src="theme.js"></script></head><body><div data-navigation></div><main><section class="page-hero"><div class="container"><p class="eyebrow">Reset Builder</p><h1>Recover on purpose—then restart.</h1><p class="lead">Build a reset that restores energy without accidentally consuming the whole evening.</p></div></section><section class="section"><div class="container stack"><section class="panel"><div class="form-grid"><div class="field"><label for="routine-name">Routine name</label><select id="routine-name"><option>Quick Reset</option><option>Standard Reset</option><option>Long Reset</option></select></div><div class="field"><label for="duration">Activity duration (minutes)</label><input id="duration" type="number" min="1" max="60" value="10"></div></div><p><strong>Activity library</strong></p><div id="library" class="check-grid"></div><div class="actions"><button id="save-routine" class="button primary">Save routine</button></div></section><section class="panel"><p class="eyebrow">Saved routines</p><div id="routines" class="card-grid"></div></section><section id="runner" class="panel" hidden><p class="eyebrow">Reset in progress</p><h2 id="runner-title"></h2><p id="runner-step" class="muted"></p><div id="timer" class="timer">00:00</div><div class="actions"><button id="pause" class="button secondary">Pause</button><button id="skip" class="button secondary">Skip step</button><button id="finish" class="button primary">Finish reset</button></div></section><section id="reflection" class="panel" hidden><p class="eyebrow">Reflection</p><h2>How do you feel now?</h2><div class="actions"><button class="button secondary" data-reflect="Better">Better</button><button class="button secondary" data-reflect="Same">Same</button><button class="button secondary" data-reflect="Worse">Worse</button></div></section><section class="panel"><p class="eyebrow">Reset history</p><div id="history" class="list"></div></section></div></section></main><div data-footer></div><script src="navigation.js"></script><script src="common.js"></script><script src="reset-builder.js"></script></body></html>
