<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Mapper | Isa OS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="tools.css"><script src="theme.js"></script></head><body><div data-navigation></div><main><section class="page-hero"><div class="container"><p class="eyebrow">System Mapper</p><h1>Give every tool one clear job.</h1><p class="lead">Map the systems you use now, spot overlap, and create a planning system you can trust without checking six places.</p></div></section><section class="section"><div class="container stack"><form id="system-form" class="panel"><div class="form-grid"><div class="field"><label for="system-name">System name</label><input id="system-name" required placeholder="Google Calendar"></div><div class="field"><label for="purpose">Purpose</label><input id="purpose" placeholder="School deadlines"></div><div class="field"><label for="owner">Owner</label><input id="owner" placeholder="Isa, family, coach"></div><div class="field"><label for="frequency">Update frequency</label><select id="frequency"><option>Daily</option><option>Weekly</option><option>As needed</option><option>Rarely</option></select></div></div><div class="field" style="margin-top:16px"><label for="info">What information lives here?</label><textarea id="info" rows="2"></textarea></div><fieldset style="border:0;padding:0;margin:16px 0"><legend><strong>Information categories</strong></legend><div class="check-grid" id="categories"></div></fieldset><div class="form-grid"><label class="check-chip"><input id="merge" type="checkbox"> Can this be merged?</label><label class="check-chip"><input id="truth" type="checkbox"> Source of truth candidate</label></div><div class="actions"><button class="button primary" type="submit">Add system</button></div></form><div id="systems" class="stack"></div><section class="panel"><p class="eyebrow">Visual flow</p><div id="flow" class="flow"></div></section><section class="panel"><p class="eyebrow">My Recommended Planning System</p><div id="recommendation" class="recommendation"></div></section></div></section></main><div data-footer></div><script src="navigation.js"></script><script src="common.js"></script><script src="system-mapper.js"></script></body></html>
